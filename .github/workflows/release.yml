name: Release

on:
  push:
    tags: ['v*']

# Least privilege: the build job runs third-party build code (NuGet packages, vpk) with a read-only token.
# Only the release job gets write access.
permissions:
  contents: read

jobs:
  build:
    name: Publish ${{ matrix.rid }}
    runs-on: windows-latest
    strategy:
      matrix:
        rid: [win-x64, win-arm64]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      - name: Version from tag
        id: version
        shell: pwsh
        env:
          # Passed via env, never interpolated into the script: tag names may contain shell metacharacters.
          REF_NAME: ${{ github.ref_name }}
        run: |
          $v = $env:REF_NAME.TrimStart('v')
          if ($v -notmatch '^\d+\.\d+\.\d+(-[0-9A-Za-z.]+)?$') { throw "Tag '$env:REF_NAME' is not a valid version (expected vX.Y.Z or vX.Y.Z-suffix)." }
          "version=$v" >> $env:GITHUB_OUTPUT

      # Locked mode (CI=true): packages must match the committed packages.lock.json files exactly.
      - name: Restore (locked)
        run: dotnet restore LinkDeck.slnx --locked-mode

      - name: Test
        run: dotnet test LinkDeck.slnx --configuration Release --no-restore

      # No restore here: "-r" would change the restore graph; the locked restore above already covers both RIDs.
      - name: NativeAOT publish
        run: >
          dotnet publish src/LinkDeck.Desktop/LinkDeck.Desktop.csproj
          --configuration Release
          --runtime ${{ matrix.rid }}
          --no-restore
          -p:Version=${{ steps.version.outputs.version }}
          --output publish/${{ matrix.rid }}

      - name: Portable zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          Compress-Archive -Path publish/${{ matrix.rid }}/* -DestinationPath out/LinkDeck-${{ steps.version.outputs.version }}-${{ matrix.rid }}-portable.zip

      - name: Velopack installer
        shell: pwsh
        run: |
          dotnet tool install -g vpk --version 0.0.1298
          vpk pack `
            --packId LinkDeck `
            --packVersion ${{ steps.version.outputs.version }} `
            --packDir publish/${{ matrix.rid }} `
            --mainExe LinkDeck.exe `
            --packTitle LinkDeck `
            --icon src/LinkDeck.Desktop/Assets/linkdeck.ico `
            --runtime ${{ matrix.rid }} `
            --channel ${{ matrix.rid }} `
            --outputDir velopack
          Copy-Item velopack/* out/

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-${{ matrix.rid }}
          path: out

  release:
    name: GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write      # create the release
      id-token: write      # sign the provenance attestation
      attestations: write  # store the provenance attestation
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Build provenance attestation
        # Users verify downloads with: gh attestation verify <file> --repo balintfonad/linkdeck
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*

      - name: Release notes from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { found=1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then echo "See CHANGELOG.md." > notes.md; fi

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "LinkDeck $GITHUB_REF_NAME" --notes-file notes.md
