name: CI

on:
  push:
    branches: [master, develop]
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    name: Build and test (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      - name: Restore (locked)
        run: dotnet restore LinkDeck.slnx --locked-mode
      - name: Format check
        run: dotnet format LinkDeck.slnx --verify-no-changes --no-restore
      - name: Build
        run: dotnet build LinkDeck.slnx --configuration Release --no-restore
      - name: Test
        run: dotnet test LinkDeck.slnx --configuration Release --no-build --logger "trx" --results-directory TestResults
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-results-windows
          path: TestResults

  core-linux:
    # Proves LinkDeck.Core stays platform-agnostic.
    name: Core tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      - name: Test Core
        run: dotnet test tests/LinkDeck.Core.Tests/LinkDeck.Core.Tests.csproj --configuration Release
