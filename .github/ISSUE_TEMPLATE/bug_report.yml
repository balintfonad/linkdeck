name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! Please do **not** paste your full `config.json` if it contains internal hostnames or usernames — a minimal example is enough.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Press Ctrl+Alt+Space
        2. ...
  - type: input
    id: version
    attributes:
      label: LinkDeck version
      placeholder: 0.1.0
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Windows version and keyboard layout
      placeholder: Windows 11 23H2, Hungarian layout
  - type: textarea
    id: logs
    attributes:
      label: Log excerpt
      description: From `%LOCALAPPDATA%\LinkDeck\logs`. Logs never contain keystrokes.
      render: text
